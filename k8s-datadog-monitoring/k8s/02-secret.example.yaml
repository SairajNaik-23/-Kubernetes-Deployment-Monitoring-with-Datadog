# Secret = sensitive values (passwords, tokens).
# This is an EXAMPLE. Don't commit real secrets - create them with:
#   kubectl create secret generic demo-app-secret -n demo-app --from-literal=API_TOKEN=<value>
# Note: Secrets are only base64-encoded, not encrypted. Restrict access with RBAC
# and enable encryption at rest (or use AWS Secrets Manager / Vault) in production.
apiVersion: v1
kind: Secret
metadata:
  name: demo-app-secret
  namespace: demo-app
type: Opaque
stringData:
  API_TOKEN: "change-me"
