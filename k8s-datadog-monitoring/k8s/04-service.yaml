# Stable internal address (demo-app.demo-app.svc.cluster.local) that load-balances
# across all ready pods. NodePort also exposes it on every node at port 30080.
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: demo-app
  labels:
    app: demo-app
spec:
  type: NodePort
  selector:
    app: demo-app
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
